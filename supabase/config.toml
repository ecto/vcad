# Supabase CLI configuration
# See: https://supabase.com/docs/guides/cli/config

[db]
# Port to use for local database
port = 5432

[auth]
# Enable/disable email auth
enabled = true

# Where Supabase sends users after auth. The site URL is the canonical
# web home; additional_redirect_urls is the allow-list of every other
# URL that the magic-link / OAuth flows are allowed to redirect to.
#
# - https://vcad.io/auth/desktop is the static bridge page that forwards
#   a completed magic-link to the vcad:// custom scheme so the Tauri
#   desktop app can complete sign-in. See
#   packages/auth/src/auth-deep-link.ts and
#   packages/app/public/auth/desktop.html.
# - http://localhost:5173 lets `npm run dev -w @vcad/app` complete a
#   sign-in against the production Supabase project during local
#   development.
#
# Apply with `supabase config push` (the linked project's allow-list
# is the source of truth at runtime; this file just keeps the desired
# state in source control).
site_url = "https://vcad.io"
additional_redirect_urls = [
  "https://vcad.io/**",
  "https://vcad.io/auth/desktop",
  "http://localhost:5173",
  "http://localhost:5173/**",
]

# Anonymous sign-ins are required by the app: client.ts/ensureSession
# creates an anon session for every visitor so RLS predicates of the
# form `auth.uid() = user_id` hold uniformly across logged-in and
# logged-out users. Pinning this here so `supabase config push` can't
# silently revert the project to the CLI default of `false`.
enable_anonymous_sign_ins = true

# OAuth providers (configured in Supabase dashboard)
# [auth.external.google]
# enabled = true
# client_id = "env(GOOGLE_CLIENT_ID)"
# secret = "env(GOOGLE_CLIENT_SECRET)"

# [auth.external.github]
# enabled = true
# client_id = "env(GITHUB_CLIENT_ID)"
# secret = "env(GITHUB_CLIENT_SECRET)"

# Match the production project's hardened email settings so a future
# `supabase config push` doesn't drift them back to CLI defaults.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# 1-minute rate limit on magic-link / OTP emails (CLI default is 1s).
max_frequency = "1m0s"
# 8-digit OTP (CLI default is 6).
otp_length = 8

# Production has TOTP MFA enrollment + verification on. Don't let a
# config push flip it off.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
