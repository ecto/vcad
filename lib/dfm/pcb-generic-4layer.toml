schema = "vcad.dfm/1"
version = "1"
process = "pcb"
profile = "generic_4layer"
name = "Generic 4-layer (mainstream multilayer)"
notes = """
Mainstream multilayer floor most 4-layer fab houses meet without an advanced-process
surcharge: 5mil trace/space at 1oz, 0.2mm drills. Caps the stackup at 4 copper layers
so a 6-layer board is flagged. Via-in-pad is a warning (filled via-in-pad is common
on multilayer but still an add-on).
"""

[rules.min_trace_width]
severity = "error"
oz1_mm = 0.127
oz2_mm = 0.2
oz3_mm = 0.3

[rules.min_clearance]
severity = "error"
oz1_mm = 0.127
oz2_mm = 0.2
oz3_mm = 0.3

[rules.min_drill]
severity = "error"
min_mm = 0.2

[rules.min_annular_ring]
severity = "error"
min_mm = 0.13

[rules.copper_to_edge]
severity = "error"
min_mm = 0.25

[rules.hole_to_hole]
severity = "error"
min_mm = 0.5

[rules.soldermask_dam]
severity = "warning"
min_mm = 0.1
expansion_mm = 0.05

[rules.soldermask_sliver]
severity = "warning"
min_mm = 0.13
expansion_mm = 0.05

[rules.silk_over_pad]
severity = "warning"
clearance_mm = 0.15

[rules.acid_trap]
severity = "warning"
min_angle_deg = 90.0

[rules.via_in_pad]
severity = "warning"

[rules.max_copper_layers]
severity = "error"
max = 4
