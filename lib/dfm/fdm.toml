schema = "vcad.dfm/1"
version = "1"
process = "fdm"
name = "Standard FDM 0.4 mm nozzle"
notes = "Tuned for PLA on a 0.4 mm nozzle. Override min_wall_mm for fine-tip nozzles."

[rules.thin_wall]
severity = "error"
min_wall_mm = 0.8
fix = "thicken_wall"

[rules.steep_overhang]
severity = "warning"
max_overhang_deg = 135.0
fix = "manual"

[rules.small_hole]
severity = "warning"
min_diameter_mm = 0.8
fix = "manual"

[rules.floating_floor]
severity = "warning"
# A flat downward face above first-layer height with no geometry below
# its footprint starts printing in mid-air (the slicer's "floating
# cantilever"). Distinct from steep_overhang: 45-degree walls
# self-support; flat shelves cannot. Checked at STL export (Z-up
# assumed as print direction).
min_clearance_mm = 0.5
min_area_mm2 = 3.0
fix = "reorient_or_support"
