schema = "vcad.dfm/1"
version = "1"
process = "injection"
name = "Standard injection molding"
notes = "Defaults assume thermoplastic with a vertical (+Z) pull direction."

[rules.insufficient_draft]
severity = "warning"
min_draft_deg = 1.0
pull_dir = "+Z"
fix = "manual"

[rules.undercut]
severity = "error"
pull_dir = "+Z"
fix = "manual"

[rules.wall_thickness_uniformity]
severity = "warning"
max_thickness_cv = 0.25
fix = "manual"
