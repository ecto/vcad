[workspace.package]
version = "0.9.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/ecto/vcad"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Path-only deps from sibling repos go through path locally; the version is
# what cargo publish embeds into the registry manifest. Bump these when the
# sibling repo cuts a release; sync-version.mjs does NOT touch them.
tang = { path = "../tang/crates/tang", version = "0.2" }
tang-la = { path = "../tang/crates/tang-la", version = "0.1" }
tang-expr = { path = "../tang/crates/tang-expr", version = "0.1" }
phyz = { path = "../phyz/crates/phyz", version = "0.3" }
phyz-gpu = { path = "../phyz/crates/phyz-gpu", version = "0.1" }
phyz-model = { path = "../phyz/crates/phyz-model", version = "0.1" }
phyz-math = { path = "../phyz/crates/phyz-math", version = "0.1" }
phyz-md = { path = "../phyz/crates/phyz-md", version = "0.1" }
slotmap = "1"
anyhow = "1"
toml = "0.8"
gltf = { version = "1.4" }
base64 = { version = "0.22" }
opencascade = { version = "0.2" }
# Intra-workspace deps. Versions are kept lockstep with workspace.package.version
# by scripts/sync-version.mjs — don't hand-edit them, edit a changelog entry and
# run `npm run version:sync`.
