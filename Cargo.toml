# vcad-desktop pulls in tauri/gtk/atk which requires system dev libraries
# on Linux. Keep it out of the default build set so bare `cargo build`,
# `cargo test`, and `cargo clippy` work on stock dev boxes; CI or whoever
# is actually working on the desktop shell opts in with `-p vcad-desktop`.
default-members = [
    "crates/vcad-ir",
    "crates/vcad-parts",
    "crates/vcad",
    "crates/vcad-kernel-math",
    "crates/vcad-kernel-topo",
    "crates/vcad-kernel-geom",
    "crates/vcad-kernel-primitives",
    "crates/vcad-kernel-tessellate",
    "crates/vcad-kernel-booleans",
    "crates/vcad-kernel-nurbs",
    "crates/vcad-kernel-fillet",
    "crates/vcad-kernel-sketch",
    "crates/vcad-kernel-text",
    "crates/vcad-kernel-sweep",
    "crates/vcad-kernel-shell",
    "crates/vcad-kernel-step",
    "crates/vcad-kernel",
    "crates/vcad-kernel-constraints",
    "crates/vcad-kernel-wasm",
    "crates/vcad-kernel-drafting",
    "crates/vcad-cli",
    "crates/vcad-kernel-gpu",
    "crates/vcad-kernel-raytrace",
    "crates/vcad-kernel-urdf",
    "crates/vcad-kernel-physics",
    "crates/wasmosis",
    "crates/wasmosis/wasmosis-macro",
    "crates/vcad-slicer",
    "crates/vcad-slicer-gcode",
    "crates/vcad-slicer-bambu",
    "crates/vcad-kernel-cam",
    "crates/vcad-kernel-stocksim",
    "crates/vcad-crdt",
    "crates/vcad-app",
    "crates/vcad-chat",
    "crates/vcad-eval",
    "crates/vcad-loon",
    "crates/vcad-sim",
    "crates/vcad-ecad-symbols",
    "crates/vcad-ecad-schematic",
    "crates/vcad-ecad-pcb",
    "crates/vcad-ecad-export",
    "crates/vcad-ecad-sim",
    "crates/stepperoni",
    "crates/termview",
    "crates/vcad-embroidery",
    "crates/vcad-embroidery-pes",
    "crates/vcad-embroidery-dst",
    "crates/vcad-tool-derive",
    "crates/vcad-i18n",
]

[workspace.package]
version = "0.9.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/ecto/vcad"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tang = { path = "../tang/crates/tang" }
tang-la = { path = "../tang/crates/tang-la" }
tang-expr = { path = "../tang/crates/tang-expr" }
slotmap = "1"
anyhow = "1"
toml = "0.8"
gltf = { version = "1.4" }
base64 = { version = "0.22" }
opencascade = { version = "0.2" }
vcad-ir = { path = "crates/vcad-ir" }
vcad-parts = { path = "crates/vcad-parts" }
vcad-kernel = { path = "crates/vcad-kernel" }
vcad-kernel-math = { path = "crates/vcad-kernel-math" }
vcad-kernel-topo = { path = "crates/vcad-kernel-topo" }
vcad-kernel-geom = { path = "crates/vcad-kernel-geom" }
vcad-kernel-primitives = { path = "crates/vcad-kernel-primitives" }
vcad-kernel-tessellate = { path = "crates/vcad-kernel-tessellate" }
vcad-kernel-booleans = { path = "crates/vcad-kernel-booleans" }
vcad-kernel-nurbs = { path = "crates/vcad-kernel-nurbs" }
vcad-kernel-fillet = { path = "crates/vcad-kernel-fillet" }
vcad-kernel-sketch = { path = "crates/vcad-kernel-sketch" }
vcad-kernel-sweep = { path = "crates/vcad-kernel-sweep" }
vcad-kernel-shell = { path = "crates/vcad-kernel-shell" }
vcad-kernel-step = { path = "crates/vcad-kernel-step" }
vcad-kernel-constraints = { path = "crates/vcad-kernel-constraints" }
vcad-kernel-drafting = { path = "crates/vcad-kernel-drafting" }
vcad-kernel-gpu = { path = "crates/vcad-kernel-gpu" }
vcad-kernel-raytrace = { path = "crates/vcad-kernel-raytrace" }
vcad-kernel-urdf = { path = "crates/vcad-kernel-urdf" }
vcad-kernel-physics = { path = "crates/vcad-kernel-physics" }
wasmosis = { path = "crates/wasmosis" }
wasmosis-macro = { path = "crates/wasmosis/wasmosis-macro" }
vcad-slicer = { path = "crates/vcad-slicer" }
vcad-slicer-gcode = { path = "crates/vcad-slicer-gcode" }
vcad-slicer-bambu = { path = "crates/vcad-slicer-bambu" }
vcad-kernel-cam = { path = "crates/vcad-kernel-cam" }
vcad-kernel-stocksim = { path = "crates/vcad-kernel-stocksim" }
vcad-kernel-text = { path = "crates/vcad-kernel-text" }
vcad-crdt = { path = "crates/vcad-crdt" }
vcad-app = { path = "crates/vcad-app" }
vcad-eval = { path = "crates/vcad-eval" }
vcad-loon = { path = "crates/vcad-loon" }
vcad-sim = { path = "crates/vcad-sim" }
vcad-ecad-symbols = { path = "crates/vcad-ecad-symbols" }
vcad-ecad-schematic = { path = "crates/vcad-ecad-schematic" }
vcad-ecad-pcb = { path = "crates/vcad-ecad-pcb" }
vcad-ecad-export = { path = "crates/vcad-ecad-export" }
vcad-ecad-sim = { path = "crates/vcad-ecad-sim" }
nom = "7"
rstar = "0.12"
stepperoni = { path = "crates/stepperoni" }
termview = { path = "crates/termview" }
vcad-embroidery = { path = "crates/vcad-embroidery" }
vcad-embroidery-pes = { path = "crates/vcad-embroidery-pes" }
vcad-embroidery-dst = { path = "crates/vcad-embroidery-dst" }
vcad-tool-derive = { path = "crates/vcad-tool-derive" }

# GPU stack — version-pin here, each consumer opts into the features it needs.
wgpu = { version = "23" }
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.4"

# Unwinding panics let the evaluator catch a kernel assertion (e.g. the
# add_loop invariant in vcad-kernel-topo) and turn it into a per-root
# failure instead of aborting the whole WASM module with an `unreachable`
# trap. The ~small binary-size cost is worth keeping 19 good features
# rendering when a 20th hits a kernel bug.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"
