    "crates/vcad-kernel-cam",
    "crates/vcad-kernel-stocksim",
    "crates/vcad-crdt",
    "crates/vcad-app",
    "crates/vcad-chat",
    "crates/vcad-eval",
    "crates/vcad-loon",
    "crates/vcad-sim",
    "crates/vcad-ecad-symbols",
    "crates/vcad-ecad-schematic",
