# GPU stack — version-pin here, each consumer opts into the features it needs.
wgpu = { version = "23" }
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.4"

# Unwinding panics let the evaluator catch a kernel assertion (e.g. the
# add_loop invariant in vcad-kernel-topo) and turn it into a per-root
# failure instead of aborting the whole WASM module with an `unreachable`
# trap. The ~small binary-size cost is worth keeping 19 good features
# rendering when a 20th hits a kernel bug.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

# Size-optimized profile for the Typst plugin WASM
# (scripts/build-typst-plugin.sh).
[profile.typst-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The FEA refinement studies run PCG on ~100k-DOF systems in their tests;
# unoptimized they take minutes, optimized seconds.
[profile.dev.package.vcad-kernel-fea]
opt-level = 3
