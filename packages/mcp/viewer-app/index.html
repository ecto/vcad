<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vcad</title>
<style>
  /* vcad design tokens — mirrors packages/app/src/index.css.
     The viewer is vcad-branded chrome: host theme picks dark/light,
     the palette itself is vcad's. */
  :root {
    --brand: #F92672;
    --brand-hover: #d91e63;

    --bg: #0E0E10;
    --surface: #1A1A1D;
    --border: #3A3A40;
    --border-soft: #2F2F34;
    --text: #F5F5F5;
    --text-2: #D4D4D4;
    --text-muted: #9C9CA3;
    --text-tert: #6A6A70;
    --hover: #26262B;
    --fill: #232327;

    --radius-sm: 6px;
    --hairline: 0.5px;
    --vignette: rgba(0, 0, 0, 0.15);

    --font-ui: "Inter", -apple-system, "SF Pro Text", system-ui, "Segoe UI",
      Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Berkeley Mono", ui-monospace, "SF Mono", SFMono-Regular,
      Menlo, Consolas, monospace;
  }
  .light {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --border: #D4D4D4;
    --border-soft: #D4D4D4;
    --text: #000000;
    --text-2: #171717;
    --text-muted: #666666;
    --text-tert: #999999;
    --hover: #F4F4F5;
    --fill: #F4F4F5;
    --vignette: rgba(0, 0, 0, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; min-height: 380px; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .light body, body.light { -webkit-font-smoothing: auto; }

  #frame { display: flex; flex-direction: column; width: 100%; height: 100%; }

  /* ── Header chrome ─────────────────────────────────────────── */
  #header {
    flex: none; display: flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 10px;
    background: var(--surface);
    border-bottom: var(--hairline) solid var(--border);
    user-select: none;
  }
  #wordmark {
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--text);
  }
  #wordmark .dot { color: var(--brand); }
  #doc-label {
    font: 11px var(--font-mono);
    color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
  }
  .btn {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    height: 22px; padding: 0 9px;
    background: var(--fill);
    color: var(--text-2);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius-sm);
    font: 500 11px var(--font-ui);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    display: none;
  }
  .btn:hover { background: var(--hover); color: var(--text); }
  .btn-brand { border-color: transparent; background: var(--brand); color: #fff; }
  .btn-brand:hover { background: var(--brand-hover); color: #fff; }

  /* ── Viewport ──────────────────────────────────────────────── */
  #stage { position: relative; flex: 1; min-height: 0; background: var(--bg); }
  #stage canvas { display: block; width: 100%; height: 100%; }
  /* Post-processing stand-in: matches the app's Vignette pass
     (darkness 0.15 dark / 0.1 light). */
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, var(--vignette) 100%);
  }
  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px;
    font-size: 12px; color: var(--text-muted);
    pointer-events: none;
  }
  #loading.hidden { display: none; }
  #error { color: var(--brand); font: 11px var(--font-mono); white-space: pre-wrap; max-width: 80%; }

  /* ── Status bar ────────────────────────────────────────────── */
  #statusbar {
    flex: none; display: flex; align-items: center; gap: 8px;
    height: 26px; padding: 0 10px;
    background: var(--surface);
    border-top: var(--hairline) solid var(--border);
    font: 11px var(--font-mono);
    color: var(--text-muted);
    user-select: none;
    overflow: hidden;
  }
  #pulse {
    flex: none; width: 7px; height: 7px; border-radius: 999px;
    background: var(--text-tert);
    transition: background 0.3s;
  }
  #pulse.busy { background: var(--brand); animation: pulse 1s ease-in-out infinite; }
  #pulse.ready { background: #98c379; }
  #pulse.error { background: var(--brand); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  #ticker { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stats { flex: none; color: var(--text-tert); white-space: nowrap; }

  /* ── Selection chip ────────────────────────────────────────── */
  #sel-chip {
    flex: none; display: none; align-items: center; gap: 6px;
    height: 18px; padding: 0 4px 0 8px;
    background: color-mix(in srgb, var(--brand) 12%, transparent);
    border: var(--hairline) solid color-mix(in srgb, var(--brand) 45%, transparent);
    border-radius: 999px;
    color: var(--text-2);
    white-space: nowrap;
    max-width: 45%;
  }
  #sel-chip.visible { display: inline-flex; }
  #sel-label { overflow: hidden; text-overflow: ellipsis; }
  #sel-label b { color: var(--text); font-weight: 600; }
  .chip-btn {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    height: 14px; padding: 0 5px;
    background: transparent; border: none; border-radius: 999px;
    font: 500 10px var(--font-ui);
    color: var(--text-muted); cursor: pointer;
  }
  .chip-btn:hover { color: var(--text); background: color-mix(in srgb, var(--brand) 25%, transparent); }
  #ask-btn { color: var(--brand); display: none; }
  #ask-btn.visible { display: inline-flex; }
  #ask-btn:hover { color: #fff; background: var(--brand); }

  /* ── Ask bar (sendMessage composer) ────────────────────────── */
  #ask-bar {
    position: absolute; left: 10px; right: 10px; bottom: 10px;
    display: none; align-items: center; gap: 6px;
    height: 32px; padding: 0 4px 0 10px;
    background: var(--surface);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }
  #ask-bar.visible { display: flex; }
  #ask-prefix {
    flex: none; font: 11px var(--font-mono); color: var(--brand);
    max-width: 35%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #ask-input {
    flex: 1; height: 100%; min-width: 0;
    background: transparent; border: none; outline: none;
    font: 12px var(--font-ui); color: var(--text);
  }
  #ask-input::placeholder { color: var(--text-tert); }
  #ask-send { display: inline-flex; }

  /* ── Sim transport bar (create_robot_env replay) ───────────── */
  #transport {
    position: absolute; left: 10px; right: 10px; bottom: 10px;
    display: none; flex-direction: column; gap: 3px;
    padding: 6px 10px;
    background: var(--surface);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    user-select: none;
  }
  #transport.visible { display: flex; }
  /* Bars stack: the ask composer rides above the transport when both show. */
  #transport.visible ~ #ask-bar { bottom: 76px; }
  #tp-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tp-btn {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 22px;
    background: var(--fill); color: var(--text-2);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius-sm);
    font: 500 11px var(--font-ui);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tp-btn:hover { background: var(--hover); color: var(--text); }
  #tp-scrub { flex: 1; min-width: 40px; height: 4px; accent-color: var(--brand); cursor: pointer; }
  #tp-step {
    flex: none; min-width: 52px; text-align: center; white-space: nowrap;
    font: 10px var(--font-mono); color: var(--text-muted);
  }
  #tp-speed {
    flex: none; height: 22px; padding: 0 4px;
    background: var(--fill); color: var(--text-2);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius-sm);
    font: 500 10px var(--font-ui);
    cursor: pointer; outline: none;
  }
  #tp-spark { flex: none; width: 88px; height: 18px; overflow: visible; }
  #tp-spark-line { fill: none; stroke: var(--text-muted); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  #tp-spark-dot { fill: var(--brand); }
  #tp-live {
    flex: none; display: inline-flex; align-items: center;
    height: 16px; padding: 0 7px; border-radius: 999px;
    background: var(--fill); color: var(--text-tert);
    border: var(--hairline) solid var(--border);
    font: 600 9px var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase;
    cursor: pointer;
  }
  #tp-live.on {
    background: color-mix(in srgb, #98c379 18%, transparent);
    color: #98c379; border-color: transparent;
  }
  #tp-live.ping { animation: pulse 0.6s ease-in-out 1; }
  #tp-readout {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    font: 10px var(--font-mono); color: var(--text-muted);
  }
  #tp-joints { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tp-note { flex: none; font: italic 10px var(--font-ui); color: var(--text-tert); white-space: nowrap; }

  /* ── Receipt ledger (build_receipt) ────────────────────────── */
  /* Opaque on --surface by design: a proof you can't read is not a
     proof, so monospaced measured numbers never bleed onto the stage. */
  #receipt {
    position: absolute; top: 8px; right: 8px; bottom: 8px;
    width: 290px; max-width: 62%;
    display: none; flex-direction: column;
    background: var(--surface);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.30);
    overflow: hidden;
  }
  #receipt.visible { display: flex; }
  #receipt-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 8px 8px 10px;
    border-bottom: var(--hairline) solid var(--border-soft);
  }
  #receipt-badge {
    flex: none; display: inline-flex; align-items: center;
    height: 19px; padding: 0 9px; border-radius: 999px;
    font: 600 11px var(--font-ui); white-space: nowrap;
  }
  .badge-hold { background: color-mix(in srgb, #98c379 18%, transparent); color: #98c379; }
  .badge-warn { background: color-mix(in srgb, #e5c07b 20%, transparent); color: #e5c07b; }
  .badge-bad  { background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand); }
  #receipt-title { flex: 1; font: 600 12px var(--font-ui); color: var(--text); }
  #receipt-rerun { display: none; }
  #receipt-hash {
    flex: none; padding: 6px 10px;
    font: 10px var(--font-mono); color: var(--text-tert);
    word-break: break-all;
    border-bottom: var(--hairline) solid var(--border-soft);
  }
  #receipt-body {
    flex: 1; overflow-y: auto; padding: 8px 10px;
    font: 11px var(--font-mono); color: var(--text-2);
  }
  .rcpt-sec { margin-bottom: 11px; }
  .rcpt-sec h4 {
    margin-bottom: 4px;
    font: 600 10px var(--font-ui); letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-tert);
  }
  .rcpt-row {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 3px 0;
    border-bottom: var(--hairline) solid var(--border-soft);
  }
  .rcpt-row:last-child { border-bottom: none; }
  .rcpt-row .k { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rcpt-row .v { flex: none; color: var(--text); }
  .rcpt-viol { cursor: pointer; }
  .rcpt-viol:hover .k, .rcpt-viol:hover .v { color: var(--brand); }
  .rcpt-muted .k, .rcpt-muted .v { color: var(--text-tert); }

  /* ── Order dock (get_order_feed) ───────────────────────────── */
  /* Same opaque-ledger rationale as the receipt: money states must be
     legible, never blended into the stage. Read-only by design — the
     only affordance that leaves the iframe is the approve deep link. */
  #orders {
    position: absolute; top: 8px; right: 8px; bottom: 8px;
    width: 290px; max-width: 62%;
    display: none; flex-direction: column;
    background: var(--surface);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.30);
    overflow: hidden;
  }
  #orders.visible { display: flex; }
  #orders.collapsed { bottom: auto; }
  #orders.collapsed #orders-body, #orders.collapsed #orders-foot { display: none; }
  /* Yield to the receipt ledger / transport bar when they're open. */
  #receipt.visible ~ #orders { right: 306px; }
  #transport.visible ~ #orders { bottom: 76px; }
  #transport.visible ~ #orders.collapsed { bottom: auto; }
  #orders-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 8px 8px 10px;
    border-bottom: var(--hairline) solid var(--border-soft);
  }
  #orders-title { flex: 1; font: 600 12px var(--font-ui); color: var(--text); }
  #orders-count { flex: none; font: 10px var(--font-mono); color: var(--text-tert); }
  #orders-body { flex: 1; overflow-y: auto; padding: 8px 10px; }
  #orders-foot {
    flex: none; padding: 6px 10px;
    border-top: var(--hairline) solid var(--border-soft);
    font: 10px var(--font-mono); color: var(--text-muted);
  }
  .ord-card {
    padding: 8px 0 9px;
    border-bottom: var(--hairline) solid var(--border-soft);
  }
  .ord-card:first-child { padding-top: 2px; }
  .ord-card:last-child { border-bottom: none; }
  .ord-name { font: 600 12px var(--font-ui); color: var(--text); }
  .ord-sub {
    margin-top: 2px;
    font: 10px var(--font-mono); color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ord-total { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .ord-total b { font: 600 13px var(--font-ui); color: var(--text); }
  .pill {
    display: inline-flex; align-items: center;
    height: 15px; padding: 0 7px; border-radius: 999px;
    font: 600 9px var(--font-ui); letter-spacing: 0.05em; text-transform: uppercase;
  }
  .pill-estimate { background: color-mix(in srgb, var(--text-muted) 16%, transparent); color: var(--text-muted); }
  .pill-quoted { background: color-mix(in srgb, #e5c07b 20%, transparent); color: #e5c07b; }
  .pill-binding { background: color-mix(in srgb, #98c379 18%, transparent); color: #98c379; }
  .ord-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
  .ord-chip {
    display: inline-flex; align-items: center;
    height: 14px; padding: 0 6px; border-radius: 999px;
    font: 500 9px var(--font-ui);
    background: var(--fill); color: var(--text-tert);
    border: var(--hairline) solid var(--border-soft);
  }
  .ord-chip.done { color: var(--text-muted); border-color: var(--border); }
  .ord-chip.now {
    background: color-mix(in srgb, var(--brand) 14%, transparent);
    border-color: color-mix(in srgb, var(--brand) 45%, transparent);
    color: var(--text); font-weight: 600;
  }
  .ord-chip.fail {
    background: color-mix(in srgb, var(--brand) 16%, transparent);
    border-color: transparent; color: var(--brand); font-weight: 600;
  }
  .ord-wait { margin-top: 5px; font: italic 10px var(--font-ui); color: var(--text-muted); }
  .ord-banner {
    margin-top: 6px; padding: 6px 8px;
    background: color-mix(in srgb, #e5c07b 10%, transparent);
    border: var(--hairline) solid color-mix(in srgb, #e5c07b 40%, transparent);
    border-radius: var(--radius-sm);
  }
  .ord-banner-text { font: 10px var(--font-mono); color: var(--text-2); }
  .ord-banner .btn { display: inline-flex; margin-top: 5px; }
  .ord-rcpt { margin-top: 6px; }
  .rcpt-chip {
    display: inline-flex; align-items: center;
    height: 15px; padding: 0 7px; border-radius: 999px;
    font: 600 9px var(--font-ui);
  }
  .rcpt-chip.holds { background: color-mix(in srgb, #98c379 18%, transparent); color: #98c379; }
  .rcpt-chip.bad { background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand); }
  .rcpt-chip.unverified { background: color-mix(in srgb, var(--text-muted) 14%, transparent); color: var(--text-tert); }
  .ord-evt-toggle {
    margin-top: 6px; padding: 0;
    background: transparent; border: none;
    font: 500 10px var(--font-ui); color: var(--text-muted);
    cursor: pointer;
  }
  .ord-evt-toggle:hover { color: var(--text); }
  .ord-events { margin-top: 4px; }
  .ord-evt {
    display: flex; gap: 6px; padding: 2px 0;
    font: 10px var(--font-mono); color: var(--text-muted);
  }
  .ord-evt .t { flex: none; color: var(--text-tert); }
  .ord-evt .s { flex: none; color: var(--text-2); }
  .ord-evt .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="frame">
  <div id="header">
    <span id="wordmark">vcad<span class="dot">.</span></span>
    <span id="doc-label"></span>
    <button id="fullscreen-btn" class="btn">Fullscreen</button>
    <button id="open-btn" class="btn btn-brand">Open in vcad.io</button>
  </div>
  <div id="stage">
    <div id="loading">
      <div id="status">connecting…</div>
      <div id="error"></div>
    </div>
    <div id="vignette"></div>
    <div id="transport">
      <div id="tp-main">
        <button id="tp-play" class="tp-btn" title="Play">▶</button>
        <input id="tp-scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Scrub simulation steps" />
        <span id="tp-step">0 / 0</span>
        <select id="tp-speed" title="Playback speed" aria-label="Playback speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
        <svg id="tp-spark" viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true">
          <polyline id="tp-spark-line" points=""></polyline>
          <circle id="tp-spark-dot" cx="-10" cy="8" r="2"></circle>
        </svg>
        <button id="tp-live" title="Follow the newest step">live</button>
      </div>
      <div id="tp-readout">
        <span id="tp-joints"></span>
        <span id="tp-note"></span>
      </div>
    </div>
    <div id="ask-bar">
      <span id="ask-prefix"></span>
      <input id="ask-input" type="text" placeholder="ask about this part…" />
      <button id="ask-send" class="btn btn-brand">Send</button>
    </div>
    <div id="receipt">
      <div id="receipt-head">
        <span id="receipt-badge"></span>
        <span id="receipt-title">Receipt</span>
        <button id="receipt-rerun" class="btn">Re-run</button>
        <button id="receipt-close" class="chip-btn" title="Close">✕</button>
      </div>
      <div id="receipt-hash"></div>
      <div id="receipt-body"></div>
    </div>
    <div id="orders">
      <div id="orders-head">
        <span id="orders-title">Orders</span>
        <span id="orders-count"></span>
        <button id="orders-toggle" class="chip-btn" title="Collapse">▾</button>
      </div>
      <div id="orders-body"></div>
      <div id="orders-foot"></div>
    </div>
  </div>
  <div id="statusbar">
    <span id="pulse"></span>
    <span id="ticker">connecting to host…</span>
    <span id="sel-chip">
      <span id="sel-label"></span>
      <button id="ask-btn" class="chip-btn" title="Send a message about this part">Ask</button>
      <button id="sel-clear" class="chip-btn" title="Clear selection (Esc)">✕</button>
    </span>
    <span id="stats"></span>
  </div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
