<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to vcad — Desktop</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/InterVariable.woff2") format("woff2-variations");
      }

      :root {
        color-scheme: dark;
        --bg: #0e0e10;
        --surface: #1a1a1d;
        --border: #3a3a40;
        --text: #f5f5f5;
        --text-muted: #9c9ca3;
        --hover: #26262b;
        --brand: #f92672;
        --brand-hover: #d91e63;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #ffffff;
          --surface: #ffffff;
          --border: #d4d4d4;
          --text: #000000;
          --text-muted: #666666;
          --hover: rgba(0, 0, 0, 0.04);
          --brand: #f92672;
          --brand-hover: #d91e63;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-optical-sizing: auto;
      }

      main {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .card {
        width: 100%;
        max-width: 19rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        text-align: center;
      }

      .wordmark {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Inter", system-ui, sans-serif;
        font-size: 3.5rem;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1;
        color: var(--text);
        user-select: none;
      }
      .wordmark .dot {
        color: var(--brand);
      }

      .status {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0;
      }

      .progress {
        position: relative;
        width: 100%;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--border);
      }
      .progress .bar {
        position: absolute;
        inset: 0 auto 0 -33%;
        width: 33%;
        border-radius: 999px;
        background: var(--brand);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          left: -33%;
        }
        50% {
          left: 50%;
        }
        100% {
          left: 100%;
        }
      }

      .actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .btn {
        height: 2.25rem;
        padding: 0 0.875rem;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #ffffff;
      }
      .btn.primary:hover {
        background: var(--brand-hover);
        border-color: var(--brand-hover);
      }
      .btn:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      .hide {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="wordmark">vcad<span class="dot">.</span></div>
        <p id="status" class="status">Opening the desktop app…</p>
        <div id="progress" class="progress" aria-hidden="true">
          <div class="bar"></div>
        </div>
        <div id="actions" class="actions hide">
          <button id="retry" class="btn primary hide" type="button">
            Open vcad
          </button>
          <a id="web" class="btn hide" href="https://vcad.io/"
            >Continue in browser</a
          >
        </div>
        <noscript>
          <p class="status">
            Enable JavaScript to complete sign-in, or open this link on the
            device where vcad is installed.
          </p>
        </noscript>
      </div>
    </main>
    <script src="/auth/desktop.js"></script>
  </body>
</html>
