<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    vcad logo — "The Open Solid" (full-bleed)
    The cube is the mark. No squircle, no background. The hexagonal
    silhouette is the icon. Front (1,1,1) corner truncated to expose
    the boundary as a triangular cut — BRep made literal.

    Geometry: axonometric 30°/30°, edge unit L=512, center (512,512).
      hexagon — T(512,0)  UR(955.39,256)  LR(955.39,768)
                B(512,1024)  LL(68.61,768)  UL(68.61,256)
      cut triangle — TL(290.3,384)  TR(733.7,384)  BC(512,768)
  -->
  <defs>
    <linearGradient id="faceTop" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#7a8aaa"/>
      <stop offset="55%"  stop-color="#4f5b73"/>
      <stop offset="100%" stop-color="#323a4b"/>
    </linearGradient>

    <linearGradient id="faceRight" x1="0" y1="0.15" x2="1" y2="0.9">
      <stop offset="0%"   stop-color="#454f63"/>
      <stop offset="100%" stop-color="#1f2632"/>
    </linearGradient>

    <linearGradient id="faceLeft" x1="1" y1="0.15" x2="0" y2="0.9">
      <stop offset="0%"   stop-color="#2e3645"/>
      <stop offset="100%" stop-color="#13171f"/>
    </linearGradient>

    <radialGradient id="cavity" cx="50%" cy="55%" r="68%">
      <stop offset="0%"   stop-color="#3e261a"/>
      <stop offset="35%"  stop-color="#1a0e07"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="topHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="edgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <polygon points="512,0 955.39,256 733.7,384 290.3,384 68.61,256"        fill="url(#faceTop)"/>
  <polygon points="955.39,256 955.39,768 512,1024 512,768 733.7,384"      fill="url(#faceRight)"/>
  <polygon points="512,1024 68.61,768 68.61,256 290.3,384 512,768"        fill="url(#faceLeft)"/>

  <polygon points="290.3,384 733.7,384 512,768" fill="url(#cavity)"/>
  <circle cx="512" cy="512" r="26" fill="#3e2a1c" opacity="0.55"/>

  <g stroke="#10141c" stroke-width="3" fill="none" stroke-linejoin="round" opacity="0.95">
    <polygon points="512,0 955.39,256 955.39,768 512,1024 68.61,768 68.61,256"/>
    <line x1="955.39" y1="256"  x2="733.7" y2="384"/>
    <line x1="68.61"  y1="256"  x2="290.3" y2="384"/>
    <line x1="512"    y1="1024" x2="512"   y2="768"/>
  </g>

  <g filter="url(#edgeGlow)" opacity="0.9">
    <polygon points="290.3,384 733.7,384 512,768" fill="none" stroke="#00b4d8" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <polygon points="290.3,384 733.7,384 512,768" fill="none" stroke="#7be9ff" stroke-width="5" stroke-linejoin="round"/>

  <line x1="68.61"  y1="256" x2="512"    y2="0"   stroke="url(#topHighlight)" stroke-width="5" stroke-linecap="round"/>
  <line x1="512"    y1="0"   x2="955.39" y2="256" stroke="url(#topHighlight)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <g fill="#9bf0ff">
    <circle cx="290.3" cy="384" r="13"/>
    <circle cx="733.7" cy="384" r="13"/>
    <circle cx="512"   cy="768" r="13"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="290.3" cy="384" r="4.5"/>
    <circle cx="733.7" cy="384" r="4.5"/>
    <circle cx="512"   cy="768" r="4.5"/>
  </g>
</svg>
