[package]
name = "vcad-cam-api"
description = "The JSON request/response surface for vcad CAM, shared by the C ABI, WASM and MCP."
readme = "README.md"
keywords = ["cad", "cam", "gcode", "toolpath", "json"]
categories = ["science", "simulation", "hardware-support"]
include = ["src/**/*", "README.md"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vcad-kernel-cam = { workspace = true }
# Only for the one shared input hasher: the deposit and the receipt builder
# that re-states it have to agree byte for byte. Just the CAM family —
# cam-api does not drag the other domains in.
vcad-claim-registry = { workspace = true, features = ["cam"] }
serde = { workspace = true }
serde_json = { workspace = true }
