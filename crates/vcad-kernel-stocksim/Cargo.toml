[package]
name = "vcad-kernel-stocksim"
description = "Stock simulation and material removal for vcad CAM"
readme = "README.md"
keywords = ["cad", "kernel", "stocksim", "brep", "geometry"]
categories = ["science", "simulation", "hardware-support"]
include = ["src/**/*", "README.md"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vcad-kernel-math = { workspace = true }
vcad-kernel-cam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Cap triangulation for the test targets: a target mesh has to be closed,
# and ear-clipping a polygon with holes is the simplest correct way there.
earcutr = "0.4"
