[package]
name = "vcad-kernel-text"
description = "Text to geometry conversion for vcad kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ttf-parser = "0.25"
thiserror = { workspace = true }
vcad-kernel-math = { workspace = true }
vcad-kernel-sketch = { workspace = true }

[features]
# Drop the include_bytes!() of assets/NotoSans-Regular.ttf (~27 KB) for builds
# that never render text. `Font::default()` then yields an empty font.
no-builtin-font = []

[dev-dependencies]
