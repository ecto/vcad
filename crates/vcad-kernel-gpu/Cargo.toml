[package]
name = "vcad-kernel-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU-accelerated geometry operations for vcad"

[dependencies]
# The device itself lives in kosm-render now, alongside the path tracer that
# was the reason for its adapter limits. This crate re-exports it.
kosm-render = { path = "/Users/cam/Developer/kosm/.claude/worktrees/basketball-sim-kosm-67b384/crates/kosm-render", features = ["gpu"] }
tang-expr = { workspace = true }
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
bytemuck = { workspace = true }
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
