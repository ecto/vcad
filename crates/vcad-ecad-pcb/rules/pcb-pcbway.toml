schema = "vcad.dfm/1"
version = "1"
process = "pcb"
profile = "pcbway"
name = "PCBWay standard (1oz, advanced trace/space)"
notes = """
Tuned to PCBWay's published standard FR-4 process. PCBWay etches to 3.5mil
(0.0889mm) track/space at 1oz and drills to 0.15mm, so the trace/space and drill
floors are tighter than the generic packs. Via-in-pad is a warning (resin-filled
via-in-pad is an add-on service).
"""

[rules.min_trace_width]
severity = "error"
oz1_mm = 0.0889
oz2_mm = 0.1524
oz3_mm = 0.254

[rules.min_clearance]
severity = "error"
oz1_mm = 0.0889
oz2_mm = 0.1524
oz3_mm = 0.254

[rules.min_drill]
severity = "error"
min_mm = 0.15

[rules.min_annular_ring]
severity = "error"
min_mm = 0.13

[rules.copper_to_edge]
severity = "error"
min_mm = 0.2

[rules.hole_to_hole]
severity = "error"
min_mm = 0.5

[rules.soldermask_dam]
severity = "warning"
min_mm = 0.1
expansion_mm = 0.05

[rules.soldermask_sliver]
severity = "warning"
min_mm = 0.13
expansion_mm = 0.05

[rules.silk_over_pad]
severity = "warning"
clearance_mm = 0.15

[rules.acid_trap]
severity = "warning"
min_angle_deg = 90.0

[rules.via_in_pad]
severity = "warning"

[rules.max_copper_layers]
severity = "error"
max = 8
