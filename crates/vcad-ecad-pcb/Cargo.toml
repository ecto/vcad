[package]
name = "vcad-ecad-pcb"
description = "PCB layout operations: routing, copper pour, DRC, and spatial indexing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
vcad-kernel-gpu = { workspace = true, optional = true }
tang-expr = { workspace = true }
vcad-receipt = { workspace = true }
vcad-ir = { workspace = true }
vcad-ecad-package = { workspace = true }
vcad-kernel-math = { workspace = true }
vcad-kernel-sheet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
rstar = { workspace = true }
rayon = "1.10"
log = "0.4"
# IPC-2141 impedance closed forms — the same model behind the
# calc_impedance / size_impedance tools. Per-layer controlled-impedance
# geometry inverts it; it is not re-derived here.
vcad-ecad-sim = { path = "../vcad-ecad-sim" }

[dev-dependencies]
vcad-ecad-export = { path = "../vcad-ecad-export" }
vcad-ecad-symbols = { workspace = true }
env_logger = "0.11"

[features]
gpu = ["dep:vcad-kernel-gpu"]
