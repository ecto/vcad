[package]
name = "vcad-ecad-diff-wasm"
description = "WASM bindings for the differentiable PCB design engine (PDN adjoint sizing + co-design)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vcad-ecad-diff = { workspace = true }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
