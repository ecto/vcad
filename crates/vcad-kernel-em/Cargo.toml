[package]
name = "vcad-kernel-em"
description = "Differentiable electromagnetic field solver: 2D/axisymmetric magnetostatics and electrostatics with inductance, capacitance, force, and torque extraction"
readme = "README.md"
keywords = ["cad", "kernel", "em", "brep", "geometry"]
categories = ["science", "simulation", "mathematics"]
include = ["src/**/*", "README.md", "examples/**/*", "tests/**/*"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
vcad-receipt = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
vcad-kernel-particle = { path = "../vcad-kernel-particle", version = "0.10.0" }
