[package]
name = "vcad-kernel-wasm"
description = "WASM bindings for the vcad B-rep kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vcad-kernel = { workspace = true }
vcad-kernel-drafting = { workspace = true }
vcad-kernel-tessellate = { workspace = true }
vcad-ir = { workspace = true }
vcad-eval = { workspace = true }
vcad-loon = { workspace = true }
wasmosis = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { workspace = true }
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
ts-rs = { version = "10", optional = true }

[features]
default = ["console_error_panic_hook", "physics", "slicer", "cam", "gpu", "raytrace", "cpu-raytrace", "ecad", "embroidery"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
gpu = ["dep:vcad-kernel-gpu"]
raytrace = ["dep:vcad-kernel-raytrace", "dep:vcad-kernel-topo", "dep:vcad-kernel-geom", "dep:vcad-kernel-math", "dep:wgpu", "gpu", "vcad-kernel-raytrace/gpu"]
cpu-raytrace = ["dep:vcad-kernel-raytrace", "dep:vcad-kernel-topo", "dep:vcad-kernel-geom", "dep:vcad-kernel-math"]
physics = ["dep:vcad-kernel-physics"]
slicer = ["dep:vcad-slicer", "dep:vcad-slicer-gcode", "dep:vcad-slicer-bambu"]
cam = ["dep:vcad-kernel-cam"]
ecad = ["dep:vcad-ecad-pcb", "dep:vcad-ecad-schematic", "dep:vcad-ecad-sim", "dep:vcad-ecad-export", "dep:vcad-ecad-symbols"]
embroidery = ["dep:vcad-embroidery", "dep:vcad-embroidery-pes", "dep:vcad-embroidery-dst"]
ts-rs = ["dep:ts-rs"]

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[dependencies.vcad-kernel-gpu]
path = "../vcad-kernel-gpu"
optional = true

[dependencies.vcad-kernel-raytrace]
path = "../vcad-kernel-raytrace"
optional = true

[dependencies.vcad-kernel-topo]
path = "../vcad-kernel-topo"
optional = true

[dependencies.vcad-kernel-geom]
path = "../vcad-kernel-geom"
optional = true

[dependencies.vcad-kernel-math]
path = "../vcad-kernel-math"
optional = true

[dependencies.wgpu]
version = "23"
optional = true

[dependencies.vcad-kernel-physics]
path = "../vcad-kernel-physics"
optional = true

[dependencies.vcad-slicer]
path = "../vcad-slicer"
optional = true

[dependencies.vcad-slicer-gcode]
path = "../vcad-slicer-gcode"
optional = true

[dependencies.vcad-slicer-bambu]
path = "../vcad-slicer-bambu"
default-features = false
optional = true

[dependencies.vcad-kernel-cam]
path = "../vcad-kernel-cam"
optional = true

[dependencies.vcad-ecad-pcb]
path = "../vcad-ecad-pcb"
optional = true

[dependencies.vcad-ecad-schematic]
path = "../vcad-ecad-schematic"
optional = true

[dependencies.vcad-ecad-sim]
path = "../vcad-ecad-sim"
optional = true

[dependencies.vcad-ecad-export]
path = "../vcad-ecad-export"
optional = true

[dependencies.vcad-ecad-symbols]
path = "../vcad-ecad-symbols"
optional = true

[dependencies.vcad-embroidery]
path = "../vcad-embroidery"
optional = true

[dependencies.vcad-embroidery-pes]
path = "../vcad-embroidery-pes"
optional = true

[dependencies.vcad-embroidery-dst]
path = "../vcad-embroidery-dst"
optional = true

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['-O', '--debuginfo']
