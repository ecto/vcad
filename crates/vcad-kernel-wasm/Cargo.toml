[package]
name = "vcad-kernel-wasm"
description = "WASM bindings for the vcad B-rep kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vcad-kernel = { workspace = true }
vcad-kernel-calibration = { workspace = true }
vcad-receipt = { workspace = true }
vcad-kernel-drafting = { workspace = true }
vcad-kernel-sheet = { workspace = true }
vcad-kernel-tessellate = { workspace = true }
vcad-kernel-export = { workspace = true }
vcad-ir = { workspace = true }
vcad-crdt = { workspace = true }
vcad-diff = { path = "../vcad-diff" }
vcad-app = { workspace = true }
vcad-chat = { path = "../vcad-chat", default-features = false }
vcad-eval = { workspace = true }
vcad-loon = { workspace = true }
vcad-render = { path = "../vcad-render", default-features = false }
vcad-parts = { workspace = true }
vcad-kernel-urdf = { workspace = true }
vcad-kernel-atoms = { workspace = true, optional = true }
wasmosis = { workspace = true }
base64 = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { workspace = true }
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
ts-rs = { version = "10", optional = true }

[features]
# The `default` set is deliberately kitchen-sink. `wasm-pack build` (see
# packages/kernel-wasm/package.json) uses it verbatim, so this list *is*
# the shipping bundle surface for the web app. Trim only if you are
# intentionally shipping a slimmer build, and update the wasm-pack
# invocation alongside.
default = ["console_error_panic_hook", "physics", "atoms", "slicer", "cam", "gpu", "raytrace", "cpu-raytrace", "ecad", "embroidery"]
# Skip the include_bytes!() compile-time font embed in vcad-kernel-text
# (the font is vendored in that crate's assets/). Off by default — shipping
# wasm keeps the font; opt in only for a deliberately slimmer bundle.
no-builtin-font = ["vcad-kernel/no-builtin-font"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
gpu = ["dep:vcad-kernel-gpu"]
raytrace = ["dep:vcad-kernel-raytrace", "dep:vcad-kernel-topo", "dep:vcad-kernel-geom", "dep:vcad-kernel-math", "dep:wgpu", "gpu", "vcad-kernel-raytrace/gpu"]
cpu-raytrace = ["dep:vcad-kernel-raytrace", "dep:vcad-kernel-topo", "dep:vcad-kernel-geom", "dep:vcad-kernel-math"]
physics = ["dep:vcad-kernel-physics"]
# Atomic/molecular domain: MD, minimization, MLIP, inverse design. The
# #[wasm_bindgen] items in vcad-kernel-atoms are collected into this bundle.
atoms = ["dep:vcad-kernel-atoms", "vcad-kernel-atoms/wasm"]
slicer = ["dep:vcad-slicer", "dep:vcad-slicer-gcode", "dep:vcad-slicer-bambu"]
cam = ["dep:vcad-kernel-cam"]
ecad = ["dep:vcad-design-constraints", "dep:vcad-ecad-pcb", "dep:vcad-ecad-fabprep", "dep:vcad-ecad-schematic", "dep:vcad-ecad-sim", "dep:vcad-ecad-export", "dep:vcad-ecad-symbols", "dep:vcad-ecad-parts", "dep:vcad-ecad-verify"]
embroidery = ["dep:vcad-embroidery", "dep:vcad-embroidery-pes", "dep:vcad-embroidery-dst"]
ts-rs = ["dep:ts-rs"]

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[dependencies.vcad-kernel-gpu]
path = "../vcad-kernel-gpu"
optional = true

[dependencies.vcad-kernel-raytrace]
path = "../vcad-kernel-raytrace"
optional = true

[dependencies.vcad-kernel-topo]
path = "../vcad-kernel-topo"
optional = true

[dependencies.vcad-kernel-geom]
path = "../vcad-kernel-geom"
optional = true

[dependencies.vcad-kernel-math]
path = "../vcad-kernel-math"
optional = true

[dependencies.wgpu]
workspace = true
optional = true

[dependencies.vcad-kernel-physics]
path = "../vcad-kernel-physics"
optional = true

[dependencies.vcad-slicer]
path = "../vcad-slicer"
optional = true

[dependencies.vcad-slicer-gcode]
path = "../vcad-slicer-gcode"
optional = true

[dependencies.vcad-slicer-bambu]
path = "../vcad-slicer-bambu"
default-features = false
optional = true

[dependencies.vcad-kernel-cam]
path = "../vcad-kernel-cam"
optional = true

[dependencies.vcad-design-constraints]
path = "../vcad-design-constraints"
optional = true

[dependencies.vcad-ecad-pcb]
path = "../vcad-ecad-pcb"
optional = true

[dependencies.vcad-ecad-fabprep]
path = "../vcad-ecad-fabprep"
optional = true
# The kernel runs the pipeline and hands the fixed board back to the session;
# writing files is `export_gerber`'s job, so the exporters stay out of the wasm
# bundle.
default-features = false

[dependencies.vcad-ecad-schematic]
path = "../vcad-ecad-schematic"
optional = true

[dependencies.vcad-ecad-sim]
path = "../vcad-ecad-sim"
optional = true

[dependencies.vcad-ecad-export]
path = "../vcad-ecad-export"
optional = true

[dependencies.vcad-ecad-symbols]
path = "../vcad-ecad-symbols"
optional = true

[dependencies.vcad-ecad-parts]
path = "../vcad-ecad-parts"
optional = true

[dependencies.vcad-ecad-verify]
path = "../vcad-ecad-verify"
optional = true

[dependencies.vcad-embroidery]
path = "../vcad-embroidery"
optional = true

[dependencies.vcad-embroidery-pes]
path = "../vcad-embroidery-pes"
optional = true

[dependencies.vcad-embroidery-dst]
path = "../vcad-embroidery-dst"
optional = true

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['-O', '--debuginfo']

# Disable wasm-opt for the release profile — the canonical optimised
# build is produced by CI (which has binaryen / network access),
# while local rebuilds in offline sandboxes can skip wasm-opt without
# breaking functionality. The resulting artifact is larger but
# behaviourally identical.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
