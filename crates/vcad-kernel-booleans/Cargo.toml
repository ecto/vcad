[package]
name = "vcad-kernel-booleans"
description = "CSG boolean operations on B-rep solids for the vcad kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
debug-boolean = []

[dependencies]
vcad-kernel-math = { workspace = true }
vcad-kernel-topo = { workspace = true }
vcad-kernel-geom = { workspace = true }
vcad-kernel-primitives = { workspace = true }
vcad-kernel-tessellate = { workspace = true }
rayon = "1.10"

[dev-dependencies]
slotmap = { workspace = true }
vcad-kernel-sketch = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "boolean_ops"
harness = false
