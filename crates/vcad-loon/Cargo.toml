[package]
name = "vcad-loon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "loon-lang front end for vcad: parametric CAD scripts to vcad IR"
# depends on unpublished loon-lang (git rev); publishable once loon ships
publish = false

[dependencies]
# Pinned to a loon revision (like phyz in the root manifest) rather than the
# sibling path, so vcad resolves when pulled by git; the root's
# [patch."https://github.com/ecto/loon"] builds local checkouts and CI against
# ../loon, the same clone they always used.
loon-lang = { git = "https://github.com/ecto/loon", rev = "211ff48207b4d521caebb450bacc3e7a94c4ae60" }
vcad-ir = { path = "../vcad-ir", version = "0.10.0" }
vcad-ecad-symbols = { workspace = true }
vcad-parts = { path = "../vcad-parts", version = "0.10.0" }
serde.workspace = true
serde_json.workspace = true
