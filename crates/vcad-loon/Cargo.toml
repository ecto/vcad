[package]
name = "vcad-loon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "loon-lang front end for vcad: parametric CAD scripts to vcad IR"

[dependencies]
# From crates.io so vcad-loon is publishable. To build against a sibling
# ../loon checkout instead, see .cargo/config.toml.example.
loon-lang = { version = "0.7" }
vcad-ir = { path = "../vcad-ir", version = "0.11.0" }
vcad-ecad-symbols = { workspace = true }
vcad-parts = { path = "../vcad-parts", version = "0.11.0" }
serde.workspace = true
serde_json.workspace = true
