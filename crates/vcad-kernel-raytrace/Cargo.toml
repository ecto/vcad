[package]
name = "vcad-kernel-raytrace"
description = "Direct BRep ray tracing for the vcad kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon = "1"
# The renderer itself lives in Kosm now: rays, hierarchies and the integrator,
# generic over anything that can be bounded and hit. This crate supplies the
# BRep half of that seam. See the workspace dep for the path-now/version-later
# story.
kosm-render = { workspace = true }
vcad-kernel-math = { workspace = true }
vcad-ir = { workspace = true }
vcad-kernel-topo = { workspace = true }
vcad-kernel-geom = { workspace = true }
vcad-kernel-primitives = { workspace = true }
vcad-kernel-tessellate = { workspace = true }
vcad-kernel-booleans = { workspace = true }
wgpu = { workspace = true, features = ["webgpu", "wgsl"], optional = true }
bytemuck = { workspace = true }
thiserror.workspace = true
tang = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[features]
default = []
# The library needs no device of its own — it packs buffers and hands them
# to kosm-render. `vcad-kernel-gpu` is only how the tests get a `GpuContext`,
# so it lives in dev-dependencies.
gpu = ["dep:wgpu", "kosm-render/gpu"]

[dev-dependencies]
vcad-kernel-fillet = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = { workspace = true }
vcad-kernel-gpu = { workspace = true }
