[package]
name = "vcad-kernel-raytrace"
description = "Direct BRep ray tracing for the vcad kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon = "1"
# The renderer itself lives in Kosm now: rays, hierarchies and the integrator,
# generic over anything that can be bounded and hit. This crate supplies the
# BRep half of that seam. Path dep until kosm-render is published.
kosm-render = { path = "/Users/cam/Developer/kosm/.claude/worktrees/basketball-sim-kosm-67b384/crates/kosm-render" }
vcad-kernel-math = { workspace = true }
vcad-ir = { workspace = true }
vcad-kernel-topo = { workspace = true }
vcad-kernel-geom = { workspace = true }
vcad-kernel-primitives = { workspace = true }
vcad-kernel-tessellate = { workspace = true }
vcad-kernel-booleans = { workspace = true }
vcad-kernel-gpu = { workspace = true, optional = true }
wgpu = { workspace = true, features = ["webgpu", "wgsl"], optional = true }
bytemuck = { workspace = true }
thiserror.workspace = true
tang = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[features]
default = []
gpu = ["dep:vcad-kernel-gpu", "dep:wgpu"]

[dev-dependencies]
vcad-kernel-fillet = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = { workspace = true }
