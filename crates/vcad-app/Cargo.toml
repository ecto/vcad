[package]
name = "vcad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared application core for vcad — evaluation, undo/redo, camera, commands"

[dependencies]
ts-rs = { version = "10", optional = true }
vcad-ir = { path = "../vcad-ir", version = "0.11.0" }
vcad-crdt = { path = "../vcad-crdt", version = "0.11.0" }
vcad-kernel = { path = "../vcad-kernel", version = "0.11.0" }
vcad-eval = { workspace = true }
vcad-kernel-math = { path = "../vcad-kernel-math", version = "0.11.0" }
vcad-i18n = { workspace = true }

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# `agent-live` only: the live frog-api end-to-end runner (examples/agent_live.rs).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]

[features]
ts-rs = ["dep:ts-rs", "vcad-crdt/ts-rs"]
# Network-backed live agent test; never on by default or in CI.
agent-live = ["dep:reqwest", "dep:sha2"]

[[example]]
name = "agent_live"
required-features = ["agent-live"]
