[package]
name = "vcad-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri v2 desktop shell for vcad"

# Override the binary name so the app appears as "vcad" in macOS activity
# monitor / dev-run menus (the OS uses the binary name, not the Tauri
# `productName`, while running via `cargo run`). Release bundles pick up
# `productName` from tauri.conf.json and are unaffected.
[[bin]]
name = "vcad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
vcad-slicer-bambu = { path = "../vcad-slicer-bambu" }
vcad-i18n = { path = "../vcad-i18n" }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.6"
