[package]
name = "vcad-kernel-particle"
description = "Charged-particle optics: axisymmetric electrostatics, ring-coil magnetics, Boris tracing, and electrode figures of merit"
readme = "README.md"
keywords = ["cad", "kernel", "particle", "brep", "geometry"]
categories = ["science", "simulation", "mathematics"]
include = ["src/**/*", "README.md", "examples/**/*", "tests/**/*"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
vcad-receipt = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
vcad-kernel-em = { workspace = true }
vcad-kernel-thermal = { workspace = true }
vcad-kernel-neutronics = { workspace = true }
vcad-kernel-tolerance = { path = "../vcad-kernel-tolerance", version = "0.10.0" }
