schema = "vcad.dfm/1"
version = "1"
process = "casting_investment"
name = "Investment casting"
notes = "Lost-wax casting; finer features than sand casting but still needs draft."

[rules.insufficient_draft]
severity = "warning"
min_draft_deg = 1.0
pull_dir = "+Z"
fix = "manual"

[rules.min_section_thickness]
severity = "error"
min_section_mm = 1.0
fix = "manual"

[rules.hot_spot]
severity = "warning"
max_thickness_ratio = 2.5
fix = "manual"
