[package]
name = "vcad-kernel-dfm"
description = "Design-for-Manufacturing analysis for the vcad kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# raytrace pulls in vcad-kernel-raytrace's BVH for thickness /
# accessibility / overhang sampling. On by default — the WASM build
# wants the better numbers — but opt-out keeps the crate buildable
# without the raytracer (e.g. no-std embedded contexts).
default = ["raytrace"]
raytrace = ["dep:vcad-kernel-raytrace"]

[dependencies]
vcad-kernel-math = { workspace = true }
vcad-kernel-topo = { workspace = true }
vcad-kernel-geom = { workspace = true }
vcad-kernel-primitives = { workspace = true }
vcad-kernel-cost = { workspace = true }
vcad-kernel-tessellate = { workspace = true }
vcad-ir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dependencies.vcad-kernel-raytrace]
workspace = true
optional = true

[dev-dependencies]
vcad-kernel-primitives = { workspace = true }
