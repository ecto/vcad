[package]
name = "vcad-render"
version = "0.9.3"
edition = "2021"
publish = false
description = "Project a .vcad document to a static isometric SVG (drafting-style line art)."

[dependencies]
vcad-eval = { workspace = true }
vcad-ir = { workspace = true }
vcad-kernel = { workspace = true }

[lib]
name = "vcad_render"
path = "src/lib.rs"

[[bin]]
name = "vcad-render"
path = "src/main.rs"
