[package]
name = "vcad-sim"
description = "Unified simulation pipeline for vcad (CPU single-env + GPU batch)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
vcad-eval = { workspace = true }
vcad-ir = { workspace = true }
vcad-kernel-physics = { workspace = true }
phyz = { workspace = true }
