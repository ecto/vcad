name: Supabase

# Migrations run in two modes:
#   - PR: spin up a local Supabase stack and apply all migrations fresh.
#     Catches SQL errors, ordering bugs, and broken references without
#     touching prod. No secrets required, so this works on fork PRs too.
#   - Push to main: apply pending migrations to the linked prod project
#     (yteuhwciuxcbjwmabawj) via `supabase db push`. Gated behind a GitHub
#     Environment so a human can require approval before prod writes.
#
# Path-filtered so unrelated PRs don't pay the ~1m Docker startup cost.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      # `supabase start` boots the full local stack (Postgres + Auth +
      # Storage + etc.) and applies every migration in supabase/migrations/
      # during Postgres init. If any migration has broken SQL or bad
      # ordering — the exact scenario prod hits on `db push` — this step
      # errors out. There's no lighter "just apply migrations" CLI command;
      # `db reset` and `db lint` both require the stack to already be up.
      - name: Start Supabase stack (applies migrations)
        run: supabase start
      # Lint runs against the now-running local stack. Advisory-only for
      # now to match the cargo-audit/npm-audit posture in ci.yml; drop
      # `|| true` to turn it into a merge gate.
      - name: Lint migrations
        run: supabase db lint || true

  deploy:
    name: Deploy migrations to production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in repo settings
    # to gate prod writes on a human approval. Also the right place to
    # scope SUPABASE_* secrets so PR jobs can't read them.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
