# Release the native Mac app: build-ffi -> bundle -> Developer ID sign ->
# notarize -> DMG -> GitHub Release -> appcast PR. See docs/mac-release.md for
# the one-time setup and the secrets this needs.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the prefix, e.g. 0.10.0 (tags desktop-v<version>)"
        required: true
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#desktop-v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::bad version '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"
          # CFBundleVersion must increase on every release Sparkle sees.
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # vcad needs tang + phyz at sibling paths (see CLAUDE.md).
      - uses: actions/checkout@v4
        with: { path: vcad }
      - uses: actions/checkout@v4
        with: { repository: ecto/tang, path: tang }
      - uses: actions/checkout@v4
        with: { repository: ecto/phyz, path: phyz }
      # The app's field-overlay decoder links tang's cram-codec crate
      # (build-tc-ffi.sh), built from the ecto/tang checkout above.

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: vcad }

      - name: Build Rust static libs
        working-directory: vcad/apple/VcadApp
        run: |
          ./build-ffi.sh
          ./build-tc-ffi.sh "$GITHUB_WORKSPACE/tang"

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          kc_pw="$(uuidgen)"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity in the p12"; exit 1; fi
          echo "VCAD_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Store notarytool credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials vcad-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$NOTARY_KEYCHAIN"
          echo "VCAD_NOTARY_PROFILE=vcad-notary" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, DMG
        working-directory: vcad/apple/VcadApp
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          VCAD_VERSION: ${{ steps.v.outputs.version }}
          VCAD_BUILD: ${{ steps.v.outputs.build }}
        run: ./release.sh

      - name: Create GitHub Release
        working-directory: vcad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="apple/VcadApp/dist/vcad-${{ steps.v.outputs.version }}.dmg"
          pre=""
          [ "${{ inputs.prerelease }}" = "true" ] && pre="--prerelease"
          gh release create "${{ steps.v.outputs.tag }}" "$dmg" \
            --target "$GITHUB_SHA" --title "vcad for Mac ${{ steps.v.outputs.version }}" \
            --generate-notes $pre

      - name: Update appcast and open a PR
        working-directory: vcad
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          version="${{ steps.v.outputs.version }}"
          tag="${{ steps.v.outputs.tag }}"
          git fetch origin main
          git checkout -B "desktop-appcast/$version" origin/main
          apple/VcadApp/scripts/make-appcast.sh \
            "apple/VcadApp/dist/vcad-$version.dmg" \
            "https://github.com/${{ github.repository }}/releases/download/$tag/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/app/public/desktop/appcast.xml
          git commit -m "chore(desktop): appcast for vcad $version"
          git push -u origin "desktop-appcast/$version"
          gh pr create --base main --head "desktop-appcast/$version" \
            --title "chore(desktop): appcast for vcad $version" \
            --body "Adds the signed Sparkle item for [$tag](https://github.com/${{ github.repository }}/releases/tag/$tag). Merging publishes the update to https://vcad.io/desktop/appcast.xml."

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "${NOTARY_KEYCHAIN:-}" ] && security delete-keychain "$NOTARY_KEYCHAIN" || true
