name: Desktop Release

# Phase 5 of the desktop plan. Builds vcad-desktop for macOS (universal),
# Windows, and Linux, and (when triggered by a tag) publishes the
# installers as a draft GitHub release. Signing/notarization only kicks
# in when the relevant secrets are set — unsigned builds still succeed,
# they just show OS warnings on first launch.
#
# Triggers
#   - workflow_dispatch: ad-hoc matrix build; artifacts only, no release.
#   - push of a `v*` tag: matrix build + draft release with installers.
#
# Adding a platform is a one-line change in the matrix.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create the draft release

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Generate the Markdown body once per release so all three matrix builds
  # upload the same signed latest.json with matching `notes`, and the GitHub
  # release page shows a single coherent write-up instead of whichever
  # platform's tauri-action won the create race.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.gen.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Enough history for release-notes.mjs to pull recent commit
          # subjects as flavor for the humanized summary.
          fetch-depth: 100

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        # Only need the root workspace for the script + @anthropic-ai/sdk;
        # skip workspace postinstall scripts to keep this fast.
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Generate release notes
        id: gen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$(node scripts/release-notes.mjs)
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "$notes"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  # Push the publishable workspace crates to crates.io. Runs in parallel with
  # `build` so a crates.io flake doesn't block desktop bundles (and vice-versa).
  # Only fires on a real `v*` tag — workflow_dispatch runs skip publishing.
  # Idempotent: if a previous run partially succeeded, re-running this job
  # picks up where it left off because the script skips already-indexed
  # versions.
  crates:
    name: Publish to crates.io
    needs: notes
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      # Same sibling-repo clones as `build`; `cargo publish` runs the in-tree
      # verify pass which compiles the crate, and that resolves path deps on
      # tang/phyz.
      - name: Clone sibling repos
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ecto/tang.git ../tang
          git clone --depth 1 https://github.com/ecto/phyz.git ../phyz
          git clone --depth 1 https://github.com/ecto/loon.git ../loon

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: crates-publish

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/publish-crates.mjs

  build:
    name: Build (${{ matrix.label }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal)
            platform: macos-latest
            rust-target: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          - label: Windows (x64)
            platform: windows-latest
            rust-target: ''
            tauri-args: ''
          - label: Linux (x64)
            platform: ubuntu-22.04
            rust-target: ''
            tauri-args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      # Path-dep sibling workspaces (mirrors ci.yml / agent.yml).
      - name: Clone sibling repos
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ecto/tang.git ../tang
          git clone --depth 1 https://github.com/ecto/phyz.git ../phyz
          git clone --depth 1 https://github.com/ecto/loon.git ../loon

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target != '' && format('{0},wasm32-unknown-unknown', matrix.rust-target) || 'wasm32-unknown-unknown' }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the desktop crate's cache keyed per-platform so macOS and
          # Linux builds don't stomp on each other.
          key: ${{ matrix.platform }}
          cache-workspace-crates: true

      - name: Install Linux system deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libatk1.0-dev \
            libayatana-appindicator3-dev \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            rpm

      - name: Install wasm-pack
        shell: bash
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund

      # Warm up @vcad/app's workspace dependencies via turbo so tauri-action's
      # subsequent beforeBuildCommand (which only runs the app's own build)
      # finds @vcad/{core,engine,ir,auth,kernel-wasm} already built.
      - name: Build @vcad/app
        run: npm run build -- --filter=@vcad/app

      # Only expose signing secrets to tauri-action when the workflow is
      # running on a real release tag. On workflow_dispatch (ad-hoc runs
      # from a branch) we build unsigned artifacts — a compromised branch
      # should not be able to lift the signing/notarization keys into its
      # build output. Dependabot (see .github/dependabot.yml) pins
      # tauri-apps/tauri-action to a commit SHA on its first update.
      #
      # Apple codesign env vars are gated on APPLE_CERTIFICATE actually being
      # set (not just "we're on a tag") because `env:` can't distinguish an
      # unset secret from an empty-string secret — any non-null value lands
      # as "" in the action, which then pipes an empty blob into
      # `security import` and fails with SecKeychainItemImport. We set the
      # vars here via $GITHUB_ENV only when the cert secret is non-empty;
      # absent that, tauri-action builds unsigned bundles. Users get a
      # Gatekeeper warning on first open but install works; when the Apple
      # secrets are added to the repo, signing lights up automatically.
      - name: Configure Apple code signing
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_IN: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_IN: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_IN: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "APPLE_CERTIFICATE secret not set; building macOS bundles unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$APPLE_ID_IN"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_IN"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_IN"
          } >> "$GITHUB_ENV"
          echo "Apple codesign env configured from repo secrets."

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # APPLE_* env vars are set by the preceding "Configure Apple code
          # signing" step (only when APPLE_CERTIFICATE is truly populated), so
          # no placeholder empty strings leak into tauri-action here.
        with:
          projectPath: crates/vcad-desktop
          # Only create a release when triggered by a tag push.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'vcad ${{ github.ref_name }}'
          # Markdown body generated once in the notes job. tauri-action forwards
          # this verbatim to the GitHub release AND to latest.json's `notes`
          # field, so the desktop updater and web banner can show the same
          # write-up to users deciding whether to install.
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri-args }}

      # For workflow_dispatch runs (no tag), preserve the installers as
      # workflow artifacts so a maintainer can inspect them without
      # cutting a release.
      - name: Upload artifacts (non-release runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: vcad-desktop-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/universal-apple-darwin/release/bundle/**/*.dmg
            target/universal-apple-darwin/release/bundle/**/*.app
