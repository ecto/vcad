# Release the native Mac app: build-ffi -> bundle -> Developer ID sign ->
# notarize -> DMG -> GitHub Release -> appcast PR. See docs/mac-release.md for
# the one-time setup and the secrets this needs.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the prefix, e.g. 0.10.0 (tags desktop-v<version>)"
        required: true
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#desktop-v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::bad version '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"
          # CFBundleVersion must increase on every release Sparkle sees.
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # vcad needs tang + phyz at sibling paths (see CLAUDE.md).
      - uses: actions/checkout@v4
        with: { path: vcad }
      - uses: actions/checkout@v4
        with: { repository: ecto/tang, path: tang }
      - uses: actions/checkout@v4
        with: { repository: ecto/phyz, path: phyz }
      # The app links tang-compress's decoder (build-tc-ffi.sh). Its source repo
      # is configured with the TANG_COMPRESS_REPO variable (owner/name).
      - name: Check tang-compress source is configured
        run: |
          if [ -z "${{ vars.TANG_COMPRESS_REPO }}" ]; then
            echo "::error::set the TANG_COMPRESS_REPO repository variable (see docs/mac-release.md)"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TANG_COMPRESS_REPO }}
          token: ${{ secrets.TANG_COMPRESS_TOKEN || github.token }}
          path: tang-compress

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: vcad }

      - name: Build Rust static libs
        working-directory: vcad/apple/VcadApp
        run: |
          ./build-ffi.sh
          ./build-tc-ffi.sh "$GITHUB_WORKSPACE/tang-compress"

      # Shared ecto org signing secrets (same cert + API key as ecto/tang;
      # see docs/mac-release.md).
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "::error::MACOS_CERT_P12 / MACOS_SIGN_IDENTITY are not set (see docs/mac-release.md)"; exit 1
          fi
          kc="$RUNNER_TEMP/release.keychain-db"
          kc_pw="$(uuidgen)"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$kc" | grep -qF "$MACOS_SIGN_IDENTITY"; then
            echo "::error::MACOS_SIGN_IDENTITY is not in MACOS_CERT_P12"; exit 1
          fi
          echo "VCAD_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Stage App Store Connect API key for notarytool
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::ASC_KEY_P8 / ASC_KEY_ID / ASC_ISSUER_ID are not set (see docs/mac-release.md)"; exit 1
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          {
            echo "VCAD_ASC_KEY_PATH=$key"
            echo "VCAD_ASC_KEY_ID=$ASC_KEY_ID"
            echo "VCAD_ASC_ISSUER=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, DMG
        working-directory: vcad/apple/VcadApp
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          VCAD_VERSION: ${{ steps.v.outputs.version }}
          VCAD_BUILD: ${{ steps.v.outputs.build }}
        run: ./release.sh

      - name: Create GitHub Release
        working-directory: vcad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="apple/VcadApp/dist/vcad-${{ steps.v.outputs.version }}.dmg"
          pre=""
          [ "${{ inputs.prerelease }}" = "true" ] && pre="--prerelease"
          gh release create "${{ steps.v.outputs.tag }}" "$dmg" \
            --target "$GITHUB_SHA" --title "vcad for Mac ${{ steps.v.outputs.version }}" \
            --generate-notes $pre

      - name: Update appcast and open a PR
        working-directory: vcad
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          version="${{ steps.v.outputs.version }}"
          tag="${{ steps.v.outputs.tag }}"
          git fetch origin main
          git checkout -B "desktop-appcast/$version" origin/main
          apple/VcadApp/scripts/make-appcast.sh \
            "apple/VcadApp/dist/vcad-$version.dmg" \
            "https://github.com/${{ github.repository }}/releases/download/$tag/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/app/public/desktop/appcast.xml
          git commit -m "chore(desktop): appcast for vcad $version"
          git push -u origin "desktop-appcast/$version"
          gh pr create --base main --head "desktop-appcast/$version" \
            --title "chore(desktop): appcast for vcad $version" \
            --body "Adds the signed Sparkle item for [$tag](https://github.com/${{ github.repository }}/releases/tag/$tag). Merging publishes the update to https://vcad.io/desktop/appcast.xml."

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "${RELEASE_KEYCHAIN:-}" ] && security delete-keychain "$RELEASE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
